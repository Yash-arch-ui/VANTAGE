name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
        env:
          # Several suites reach the public Monad testnet RPC and assert on
          # graceful degradation when it is unreachable, so no key is needed.
          RPC_URL: https://testnet-rpc.monad.xyz

      - name: Build
        run: npm run build

      # The deployed artifact is `node dist/server.js`, and nothing above this
      # step ever exercised it. A build that omits a runtime asset (schema.sql
      # did exactly this) leaves a server that answers 200 on every route while
      # storing nothing — so boot the real output and assert it can persist.
      - name: Smoke-test the compiled server
        run: |
          set -euo pipefail
          DATABASE_PATH="$RUNNER_TEMP/smoke.db" PORT=4100 node dist/server.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -sf http://localhost:4100/health >/dev/null && break
            sleep 1
          done

          curl -sf http://localhost:4100/health | grep -q '"status":"ok"'

          if grep -q "FATAL: Execution Memory init failed" "$RUNNER_TEMP/smoke.log"; then
            echo "::error::the compiled server could not initialise its database"
            cat "$RUNNER_TEMP/smoke.log"
            exit 1
          fi

          # Proves the schema was applied: a table-less DB makes this 500 or
          # return zeros forever.
          curl -sf http://localhost:4100/api/stats | grep -q '"total"'
          curl -sf 'http://localhost:4100/api/ledger?limit=1' | grep -q '"items"'
        env:
          RPC_URL: https://testnet-rpc.monad.xyz

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npx eslint src vite.config.ts
      - name: Typecheck
        # The router plugin generates routeTree.gen.ts during a build, and it is
        # not committed, so a build has to precede the typecheck.
        run: npm run build && npx tsc --noEmit
        env:
          VITE_API_URL: http://localhost:4000
          VITE_RPC_URL: https://testnet-rpc.monad.xyz
          VITE_CHAIN_ID: "10143"
      - name: Test
        run: npx vitest run
